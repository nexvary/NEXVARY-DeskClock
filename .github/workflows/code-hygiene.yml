name: AeroRadar Source Hygiene

on:
  push:
    branches: [main, develop, 'feature/**', 'quality/**', 'engineering/**']
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    name: Source hygiene (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and CI integrity
        run: python3 tools/check_source_hygiene.py
