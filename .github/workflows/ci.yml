name: AeroRadar CI

on:
  push:
    branches: [main, 'feature/**', 'develop']
  pull_request:

permissions:
  contents: read

jobs:
  # --- Core: C++20 library + CLI + unit tests (no Qt required) ---
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Debug + Release)
        run: |
          cmake -S . -B build-debug   -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake -S . -B build-release -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build Debug
        run: cmake --build build-debug   --parallel 2

      - name: Build Release
        run: cmake --build build-release --config Release --parallel 2

      - name: Test Debug
        run: ctest --test-dir build-debug   -C Debug   --output-on-failure

      - name: Test Release (verify AERO_REQUIRE is not disabled by NDEBUG)
        run: ctest --test-dir build-release -C Release --output-on-failure

  # --- Desktop: Qt 6.5 + QML smoke test ---
  desktop:
    name: Desktop Qt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.5
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.*'
          modules: 'qtquick3d'
          cache: true

      - name: Install Linux GL deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            xvfb x11-utils

      - name: Configure
        run: cmake -S . -B build -DAERORADAR_BUILD_DESKTOP=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test Core (Release)
        run: ctest --test-dir build -C Release -R simulator_tests --output-on-failure

      - name: QML smoke test (offscreen)
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          timeout 8 ./build/aeroradar_desktop || true
          echo "QML load smoke test complete"

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeroradar-desktop-${{ matrix.os }}
          path: |
            build/aeroradar_desktop*
            build/Release/aeroradar_desktop*
          if-no-files-found: ignore
